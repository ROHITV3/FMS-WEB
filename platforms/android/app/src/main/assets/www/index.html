<body>
<div id="startLoad">
    <table>
        <tr class="top">
            <td style="text-align: right;">
                &nbsp;
            </td>
        </tr>
        <tr class="middle">
            <td>
                <p id="QRButton">
                    <img id="v3nityImage" src="img/v3nity-logo.png"/>
                    <br>
                    <br>
                    <br>
                    <!-- Javascript will add button in here after PN registration attempt -->
                </p>
            </td>
        </tr>
        <tr class="top">
            <td id="countDown">
            </td>
        </tr>
    </table>
</div>
<div class="mainFrame" style="display:none;">

    <div class="V3Nity3Portal" id="V3Nity3Portal-iframe">

    </div>

<!--
The following 3 .js is from this QR code scanner tutorial.

<!--
jquery is needed for the device ID and the push notification registration.
-->
<script type="text/javascript" src="lib/jquery-new2.js"></script>

<!--
Not sure what is the purpose of this...
if both jquery and jquery.mobile-1.4.5.min.js are included, there will be

-->

<!-- cordova.js is needed for the QR code scanner.
In my index.js when calling the camera, there is this line cordova.plugins.barcodeScanner.scan -->
<script type="text/javascript" src="cordova.js"></script>

<!-- push notification registration function refactored to another .js file -->
<script type="text/javascript" src="js/registerPN.js"></script>
<script type="text/javascript" src="js/registerFCM.js"></script>
<!-- push notification handling functions refactored to another .js file -->
<script type="text/javascript" src="js/pushNotificationHandler.js"></script>

<!-- index.js must be below, else the camera will not work -->
<script type="text/javascript" src="js/index.js"></script>
